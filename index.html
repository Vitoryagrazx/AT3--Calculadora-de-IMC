<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULADORA DE IMC</title>
</head>
<body>
    <h1>CALCULADORA DE IMC</h1>

    <label for="kilo">Qual é o seu peso (em kg)?</label>
    <br>
    <input type="number" id="kilo" step="0.1" placeholder="Ex: 70.5">
    <br><br>

    <label for="metros">Qual é a sua altura (em metros)?</label>
    <br>
    <input type="number" id="metros" step="0.01" placeholder="Ex: 1.75">
    <br><br>

    <button onclick="calcularIMC()">CALCULAR IMC</button>
    <p id="resultado"></p>

    <script>
    function calcularIMC() {
        let peso = Number(document.getElementById("kilo").value);
        let altura = Number(document.getElementById("metros").value);
        let elementoResultado = document.getElementById("resultado");

        // Validação para evitar divisão por zero ou campos vazios
        if (!peso || !altura || altura <= 0) {
            elementoResultado.innerText = "Por favor, introduza valores válidos para peso e altura.";
            return;
        }

        let imc = peso / (altura * altura);
        let classificacao = "";

        if (imc < 18.5) {
            classificacao = "Baixo peso";
        } else if (imc < 25) {
            classificacao = "Peso normal";
        } else if (imc < 30) {
            classificacao = "Sobrepeso";
        } else {
            classificacao = "Obesidade";
        }

        elementoResultado.innerText = imc.toFixed(2) + " - " + classificacao;
    }
    </script>
</body>
</html>
